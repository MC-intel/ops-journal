[project]
name = "ops-journal"
version = "0.1.0"
description = "An append-only operations journal with secret refusal, plus a config-driven health-check runner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ops-journal = "ops_journal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
